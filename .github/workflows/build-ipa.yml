name: build-ipa

# Builds the iOS app on a GitHub-hosted macOS runner with code signing disabled, packages the
# result into an unsigned .ipa by hand, verifies its structure, uploads it as an artifact and
# publishes it to a rolling `nightly` release (plus a tagged release for `v*` tags).
#
# No Apple account, certificate or secret is involved (decision 0003).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app bundles a real arm64 *Linux* guest program, and only Linux has the cross toolchain. This job
  # is the cheapest possible producer of it: the same script runtime-e2e.yml executes, so the program
  # the owner's iPad runs is the one CI has already proven runs (decision 0020).
  guest-programs:
    name: Cross-compile the guest program (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build the guest programs
        run: bash tools/build-guest-binaries.sh build

      - name: Upload the two the app bundles
        uses: actions/upload-artifact@v4
        with:
          name: guest-programs
          # Only these two: the app's run button offers the hello and the stack probe. The artifact root
          # keeps the file names, so the download lands them at ios/Guest/<name> unchanged.
          path: |
            build/hello-pie-nostdlib
            build/stack-probe-nostdlib
          if-no-files-found: error
          retention-days: 90

  ipa:
    name: Unsigned IPA (macos-15)
    needs: guest-programs
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the guest programs the app carries
        uses: actions/download-artifact@v4
        with:
          name: guest-programs
          path: track-b-runtime/ios/Guest

      - name: Toolchain versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          echo "xcode-select: $(xcode-select -p)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: track-b-runtime
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml
          xcodebuild -list -project ios/UbuntuPad.xcodeproj

      - name: Build unsigned app
        working-directory: track-b-runtime
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/UbuntuPad.xcodeproj \
            -scheme UbuntuPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        working-directory: track-b-runtime
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/UbuntuPad.app"
          if [ ! -d "$APP" ]; then
            echo "app bundle not found at $APP; products were:"
            find build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          rm -rf dist
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry UbuntuPad-unsigned.ipa Payload)
          ls -lh dist/UbuntuPad-unsigned.ipa

      - name: Verify IPA structure
        run: bash tools/verify-ipa.sh track-b-runtime/dist/UbuntuPad-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuPad-unsigned-ipa
          path: track-b-runtime/dist/UbuntuPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    needs: ipa
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UbuntuPad-unsigned-ipa
          path: dist

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum UbuntuPad-unsigned.ipa > UbuntuPad-unsigned.ipa.sha256
          cat UbuntuPad-unsigned.ipa.sha256

      - name: Publish rolling nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build (unsigned IPA)
          prerelease: true
          body: |
            Rolling unsigned IPA built from `main` at commit ${{ github.sha }}.

            This build opens the diagnostics screen and carries a real arm64 **Linux** guest program,
            which the app loads and executes with Linux system calls serviced by our own code (Track B,
            Phase 2). Press **Run** to try it; the screen also measures whether this device allows the
            app to execute code it wrote, which is the one thing that cannot be checked in CI. Until the
            owner reports back from a real iPad, every iOS claim in the docs is **unverified on
            device**. Sideload with AltStore, SideStore, Sideloadly or TrollStore. Never install an
            unsigned IPA from a source you do not trust.

            How to install: see docs/SETUP.md in the repository.
          files: |
            dist/UbuntuPad-unsigned.ipa
            dist/UbuntuPad-unsigned.ipa.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UbuntuPad-unsigned.ipa
            dist/UbuntuPad-unsigned.ipa.sha256
