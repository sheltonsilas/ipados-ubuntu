name: tests

# Runs the platform-independent part of Track B on a fast, free Linux runner, and checks that the
# repository is still laid out and documented the way AGENTS.md promises.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Pinned, not `ubuntu-latest`: the label migrates to Ubuntu 26 on 2026-10-19 and the Swift
    # toolchain on a new image is a variable we do not want to inherit silently (decision 0009).
    name: Core unit tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null 2>&1; then
            echo "swift is not installed on this runner image" >&2
            exit 1
          fi
          swift --version

      - name: Build core
        working-directory: track-b-runtime/core
        run: swift build

      - name: Unit tests
        working-directory: track-b-runtime/core
        run: swift test

      - name: Cross-compile real arm64 Linux binaries for the loader tests
        # The same script `runtime-e2e.yml` executes and `build-ipa.yml` bundles, so a test can never be
        # run against a differently-built guest than the platform tests (decision 0020).
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          bash tools/build-guest-binaries.sh build

      - name: Loader, patch planner and stack builder against real arm64 binaries
        working-directory: track-b-runtime/core
        env:
          UBUNTUPAD_TEST_BINARY: ${{ github.workspace }}/build/hello-arm64
          UBUNTUPAD_TEST_NOSTDLIB_BINARY: ${{ github.workspace }}/build/hello-fixed-nostdlib
          UBUNTUPAD_TEST_PIE_BINARY: ${{ github.workspace }}/build/hello-pie-nostdlib
        # No --filter: every test that needs a real binary must run, not just the ELF ones.
        run: swift test

  layout:
    name: Repository layout and hygiene (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check layout, portability and secrets
        run: bash tools/check-layout.sh
