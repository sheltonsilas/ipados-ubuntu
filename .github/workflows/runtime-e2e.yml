name: runtime-e2e

# Track B's end-to-end proof: build a static AArch64 *Linux* program, then actually execute it on an
# Apple-silicon runner and assert the bytes that come out.
#
# Why a macOS runner for a Linux guest: the same architecture, the same 16 KiB pages and the same
# code-signing rules as the iPad. A guest that runs here exercises the real design; running it on a
# Linux x86_64 runner would exercise an emulator instead. The guest binaries are cross-compiled on
# Linux (cheap, and it keeps the cross-toolchain out of the macOS job) and passed over as artifacts.
#
# Nothing here is a simulation: if the guest's message does not come out byte for byte, this fails.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-binaries:
    name: Cross-compile the guest programs (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -n1

      - name: Build the guest programs
        # One script, shared with `tests.yml` (which tests the loader against these) and `build-ipa.yml`
        # (which bundles two of them into the app), so the guest CI executes and the guest the owner's
        # iPad runs cannot drift apart (decision 0020).
        run: bash tools/build-guest-binaries.sh build

      - name: Confirm the freestanding programs have no interpreter and no libc
        run: |
          set -euo pipefail
          for binary in build/hello-pie-nostdlib build/stack-probe-nostdlib; do
            if readelf -l "$binary" | grep -q INTERP; then
              echo "::error::$binary unexpectedly has a PT_INTERP segment"
              exit 1
            fi
            if ! readelf -h "$binary" | grep -q 'Type:[[:space:]]*DYN'; then
              echo "::error::$binary is not ET_DYN; the position-independent path is what CI must exercise"
              exit 1
            fi
            # Exactly two syscall instructions: write, then exit_group. Any more (or fewer) means the
            # runtime's patching expectations in CodePatchTests no longer describe this program.
            count=$(aarch64-linux-gnu-objdump -d "$binary" | grep -cE '[[:space:]]d4000001[[:space:]]' || true)
            echo "$binary has $count svc #0 instructions"
            if [ "$count" -ne 2 ]; then
              echo "::error::expected exactly 2 svc instructions in $binary, found $count"
              exit 1
            fi
          done

      - name: Confirm the fixed-address build really is ET_EXEC, and that it lives in the reserved region
        run: |
          set -euo pipefail
          binary=build/hello-fixed-nostdlib
          if ! readelf -h "$binary" | grep -q 'Type:[[:space:]]*EXEC'; then
            echo "::error::$binary is not ET_EXEC, so it would not test the refusal path"
            exit 1
          fi
          if readelf -l "$binary" | grep -q INTERP; then
            echo "::error::$binary unexpectedly has a PT_INTERP segment"
            exit 1
          fi
          count=$(aarch64-linux-gnu-objdump -d "$binary" | grep -cE '[[:space:]]d4000001[[:space:]]' || true)
          [ "$count" -eq 2 ] || { echo "::error::$binary has $count svc instructions, expected 2"; exit 1; }
          # This is the whole reason the runtime needs a placement decision: a normal Linux link address
          # is inside the 4 GiB that macOS reserves in every arm64 process.
          first_load=$(aarch64-linux-gnu-readelf -lW "$binary" | awk '$1 == "LOAD" { print $3; exit }')
          echo "$binary first PT_LOAD vaddr=$first_load"
          [ "$((first_load))" -lt 4294967296 ] || {
            echo "::error::the fixed-address build is linked above 4 GiB, so it would not exercise the refusal"
            exit 1
          }

      - name: Confirm the position-independent hello needs a relocation
        run: |
          set -euo pipefail
          # -W (wide) matters: the narrow output truncates the type name to "R_AARCH64_RELATIV", which
          # makes a substring search for the full name fail while the relocation is plainly there.
          aarch64-linux-gnu-readelf -rW build/hello-pie-nostdlib | head -n 20
          relocations=$(aarch64-linux-gnu-readelf -rW build/hello-pie-nostdlib | grep -c 'R_AARCH64_RELATIVE' || true)
          echo "build/hello-pie-nostdlib has $relocations R_AARCH64_RELATIVE relocation(s)"
          # If the compiler ever folds this pointer away, the end-to-end test stops proving anything:
          # the runtime's relocation pass would have nothing to do and the control run would pass too.
          if [ "$relocations" -lt 1 ]; then
            echo "::error::the position-independent hello has no relative relocation, so the CI run would not prove the relocation pass works"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: guest-binaries
          path: build/

  apple-silicon:
    name: Execute the guest on Apple silicon (macos-15)
    needs: guest-binaries
    # Pinned, not `macos-latest`: this test is about a 16 KiB-page aarch64 host, and both of those
    # properties must not change silently (decision 0009 for Linux, 0013 for this job).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: guest-binaries
          path: build

      - name: Report the host
        run: |
          set -euo pipefail
          uname -a
          uname -m
          sysctl -n hw.pagesize hw.ncpu hw.memsize
          swift --version
          ls -l build
          # The whole 16 KiB design assumption, stated where it is used.
          [ "$(uname -m)" = "arm64" ] || { echo "::error::this job must run on an arm64 host"; exit 1; }

      - name: Build the runner
        working-directory: track-b-runtime/core
        run: |
          set -euo pipefail
          swift build -c release --product ubuntupad-run
          .build/release/ubuntupad-run --version

      - name: Probe the host (before any signing)
        working-directory: track-b-runtime/core
        run: |
          set -euo pipefail
          .build/release/ubuntupad-run probe | tee "$GITHUB_WORKSPACE/probe-unsigned.txt"

      - name: Re-sign with the JIT entitlements only if executable memory was refused
        id: sign
        working-directory: track-b-runtime/core
        run: |
          set -euo pipefail
          if grep -q 'rx_mapping=ok' "$GITHUB_WORKSPACE/probe-unsigned.txt"; then
            echo "Executable memory was available without entitlements; nothing to do."
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::the kernel refused an executable mapping; falling back to an ad-hoc signature with the JIT entitlements"
          codesign --force --sign - --options runtime \
            --entitlements "$GITHUB_WORKSPACE/track-b-runtime/runner-entitlements.plist" \
            .build/release/ubuntupad-run
          codesign -d --entitlements - .build/release/ubuntupad-run || true
          .build/release/ubuntupad-run probe | tee "$GITHUB_WORKSPACE/probe-signed.txt"
          grep -q 'rx_mapping=ok' "$GITHUB_WORKSPACE/probe-signed.txt" || {
            echo "::error::even with the JIT entitlements, executable memory is unavailable; the design cannot work on this host"
            exit 1
          }
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Record which path was taken
        run: |
          {
            echo "## Phase 2 end-to-end run"
            echo
            echo "Entitlements were required: **${{ steps.sign.outputs.signed }}**"
            echo
            echo '```'
            cat "$GITHUB_WORKSPACE/probe-unsigned.txt"
            [ -f "$GITHUB_WORKSPACE/probe-signed.txt" ] && cat "$GITHUB_WORKSPACE/probe-signed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the guests and assert their output
        working-directory: track-b-runtime/core
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/assert-guest-run.sh" \
            .build/release/ubuntupad-run \
            "$GITHUB_WORKSPACE/build/hello-pie-nostdlib" \
            "$GITHUB_WORKSPACE/build/stack-probe-nostdlib" \
            "$GITHUB_WORKSPACE/build/hello-fixed-nostdlib"

      - name: Upload the run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-run-logs
          path: |
            probe-unsigned.txt
            probe-signed.txt
          if-no-files-found: ignore
